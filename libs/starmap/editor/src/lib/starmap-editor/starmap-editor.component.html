@if (store.map(); as map) {
	<label for="starmap-file-input" hidden>Karte laden</label>
	<input #fileInput id="starmap-file-input" type="file" accept=".json,application/json" hidden (change)="loadMap($event)" />

	<div class="fpa-grid-12 fpa-height-100 fpa-overflow-hidden" [class.editor-collapsed]="!editorOpen()">
		<theme-sidebar
			class="fpa-grid-col-end-2 fpa-flex fpa-flex-column fpa-height-100"
			[menuItems]="menuItems()"
			[searchable]="true"
			(menuItemSelected)="selectMenuItem($event)"
		/>

		@if (editorOpen()) {
			<section class="fpa-grid-col-end-3 fpa-flex fpa-flex-column fpa-overflow-y-auto">
				<div class="fpa-flex fpa-flex-column fpa-gap-1">
					@if (selectedSystem(); as system) {
						<theme-card>
							<starmap-editor-system-editor
								[system]="system"
								[systems]="map.systems"
								[jumpLinks]="map.jumpLinks"
								(systemSaved)="saveSystem($event)"
								(systemDeleted)="deleteSystem($event)"
								(jumpLinkCreated)="store.addJumpLink($event)"
								(jumpLinkChanged)="store.updateJumpLink($event)"
								(jumpLinkDeleted)="store.deleteJumpLink($event)"
							/>
						</theme-card>
					} @else if (selectedNebula(); as nebula) {
						<theme-card>
							<starmap-editor-nebula-editor
								[nebula]="nebula"
								(nebulaChanged)="store.updateNebula($event)"
								(nebulaDeleted)="deleteNebula($event)"
							/>
						</theme-card>
					} @else {
						<theme-card>
							<p>Bitte ein Sternensystem oder einen Nebel auswählen.</p>
						</theme-card>
					}
				</div>
			</section>
		}

		<main class="map-area fpa-overflow-hidden" [ngClass]="{ 'fpa-grid-col-end-7': editorOpen(), 'fpa-grid-col-end-10': !editorOpen() }">
			<div class="fpa-flex fpa-gap-1">
				<theme-button
					(buttonClick)="toggleEditor()"
					[icon]="editorOpen() ? iconDefinition.CARET_LEFT : iconDefinition.CARET_RIGHT"
					[color]="ButtonColorDefinition.DEFAULT"
				></theme-button>
				<theme-button-bar [buttons]="toolbarButtons" />
			</div>

			<starmap-container />
		</main>
	</div>
}
