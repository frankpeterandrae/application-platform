<theme-dialog cdkTrapFocus [cdkTrapFocusAutoCapture]="true" [darkSurface]="true">
	@if (data.componentData; as color) {
		<div class="fpa-grid-12 fpa-gap-1">
			<fpa-shared-ui-paint-swatch class="swatch fpa-grid-col-end-12 fpa-grid-col-end-sm-5" [paint]="color.paint" />

			<dl class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-grid-12 fpa-gap-05 fpa-m-0">
				<dt
					class="fpa-grid-col-end-12 fpa-grid-col-end-sm-5 fpa-font-weight-bold"
					[fpaSharedUiTranslate]="i18nTextModules.ColorDetails.lbl.SKU"
				></dt>
				<dd class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-pl-15 fpa-pl-sm-0 fpa-mb-05 fpa-mb-sm-0">
					{{ color.sku || '-' }}
				</dd>

				@if (color.alternativeNames.length) {
					<dt
						class="fpa-grid-col-end-12 fpa-grid-col-end-sm-5 fpa-font-weight-bold"
						[fpaSharedUiTranslate]="i18nTextModules.ColorDetails.lbl.AlternativeNames"
					></dt>
					<dd class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-pl-15 fpa-pl-sm-0 fpa-mb-05 fpa-mb-sm-0">
						@for (name of color.alternativeNames; track name) {
							<span class="fpa-block">{{ name }}</span>
						}
					</dd>
				}

				<dt
					class="fpa-grid-col-end-12 fpa-grid-col-end-sm-5 fpa-font-weight-bold"
					[fpaSharedUiTranslate]="i18nTextModules.ColorDetails.lbl.Type"
				></dt>
				<dd class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-pl-15 fpa-pl-sm-0 fpa-mb-05 fpa-mb-sm-0">{{ colorType() }}</dd>

				<dt
					class="fpa-grid-col-end-12 fpa-grid-col-end-sm-5 fpa-font-weight-bold"
					[fpaSharedUiTranslate]="i18nTextModules.ColorDetails.lbl.Wave"
				></dt>
				<dd class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-pl-15 fpa-pl-sm-0 fpa-mb-05 fpa-mb-sm-0">{{ color.wave }}</dd>

				<dt
					class="fpa-grid-col-end-12 fpa-grid-col-end-sm-5 fpa-font-weight-bold"
					[fpaSharedUiTranslate]="i18nTextModules.ColorDetails.lbl.Barcode"
				></dt>
				<dd class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-pl-15 fpa-pl-sm-0 fpa-mb-05 fpa-mb-sm-0">
					{{ color.barcode || '-' }}
				</dd>

				<dt
					class="fpa-grid-col-end-12 fpa-grid-col-end-sm-5 fpa-font-weight-bold"
					[fpaSharedUiTranslate]="i18nTextModules.ColorDetails.lbl.Position"
				></dt>
				<dd class="fpa-grid-col-end-12 fpa-grid-col-end-sm-7 fpa-pl-15 fpa-pl-sm-0 fpa-mb-05 fpa-mb-sm-0">
					{{ color.row }} - {{ color.column }}
				</dd>
			</dl>
		</div>
	}
</theme-dialog>
