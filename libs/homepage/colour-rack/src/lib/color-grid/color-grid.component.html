<ul class="color-grid fpa-gap-05 fpa-m-0 fpa-p-0">
	@for (color of colors(); track color.sku) {
		<li>
			<button
				type="button"
				class="color-tile fpa-button-no-style fpa-with-max fpa-height-100 fpa-p-0 fpa-text-center"
				(click)="openDetails(color)"
			>
				<fpa-shared-ui-paint-swatch class="swatch" [paint]="color.paint" />
				<span class="swatch-label fpa-flex fpa-flex-column fpa-max-width-100 fpa-light-text">
					<strong>{{ color.name }}</strong>
					<span>{{ color.row }} - {{ color.column }}</span>
				</span>
			</button>
		</li>
	}
</ul>
