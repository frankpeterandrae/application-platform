<div
	class="fpa-select-group fpa-mt-1"
	[class.fpa-select-group-dynamic]="isDynamic()"
	[class.fpa-select-group-open]="open()"
	[class.fpa-select-group-disabled]="formDisabled()"
	[class.fpa-dark-text]="darkText()"
	cdkOverlayOrigin
	#origin="cdkOverlayOrigin"
>
	@if (label()) {
		<label themeFloatingLabel [floating]="isFloating()" class="fpa-select-label" [for]="controlId()">
			{{ label() }}
		</label>
	}

	<button
		type="button"
		class="fpa-select"
		[class.fpa-dark-text]="darkText()"
		[id]="controlId()"
		[disabled]="formDisabled()"
		role="combobox"
		[attr.aria-expanded]="open()"
		[attr.aria-controls]="listboxId()"
		[attr.aria-activedescendant]="activeDescendant()"
		[attr.aria-haspopup]="'listbox'"
		(click)="toggle()"
		(keydown)="onTriggerKeydown($event)"
		(focus)="onFocus()"
		(blur)="onBlur()"
	>
		<span class="fpa-select-value">
			{{ displayValue() }}
		</span>

		<span class="fpa-select-icon" [class.fpa-select-icon-open]="open()">
			<fast-svg [class.fpa-color-main-band]="open()" [name]="IconDefinition.CARET_DOWN" [size]="'16'"></fast-svg>
		</span>
	</button>
</div>

<ng-template
	cdkConnectedOverlay
	[cdkConnectedOverlayOrigin]="origin"
	[cdkConnectedOverlayOpen]="open()"
	[cdkConnectedOverlayPositions]="positions"
	[cdkConnectedOverlayHasBackdrop]="true"
	[cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
	[cdkConnectedOverlayPush]="true"
	[cdkConnectedOverlayFlexibleDimensions]="true"
	[cdkConnectedOverlayGrowAfterOpen]="true"
	[cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
	(backdropClick)="close()"
	(detach)="close()"
	(overlayKeydown)="$event.key === 'Escape' && close()"
	(attach)="onOverlayAttached()"
>
	<div
		#selectPanel
		[id]="listboxId()"
		class="fpa-select-panel"
		[class.fpa-dark-text]="darkText()"
		role="listbox"
		[attr.aria-multiselectable]="multiple() ? true : null"
	>
		@if (emptySelection() && !multiple()) {
			<button
				#optionElement
				type="button"
				tabindex="-1"
				role="option"
				class="fpa-select-option fpa-select-option-empty"
				[class.fpa-select-option-active]="activeIndex() === 0"
				[id]="optionId(0)"
				[attr.aria-selected]="!isFilled()"
				(mouseenter)="setActiveOption(0)"
				(click)="clearSelection()"
			>
				&nbsp;
			</button>
		}

		@for (opt of options(); track opt.value; let index = $index) {
			@let optionIndex = index + (emptySelection() && !multiple() ? 1 : 0);
			<button
				#optionElement
				type="button"
				tabindex="-1"
				role="option"
				class="fpa-select-option"
				[class.fpa-select-option-selected]="isSelected(opt.value)"
				[class.fpa-select-option-active]="activeIndex() === optionIndex"
				[id]="optionId(optionIndex)"
				[attr.aria-selected]="isSelected(opt.value)"
				(mouseenter)="setActiveOption(optionIndex)"
				(click)="selectOption(opt.value)"
			>
				@if (multiple()) {
					<span class="fpa-select-option-check" aria-hidden="true">
						@if (isSelected(opt.value)) {
							<fast-svg [name]="IconDefinition.CHECK" [size]="'16'"></fast-svg>
						}
					</span>
				}

				<span>{{ opt.label }}</span>
			</button>
		}
	</div>
</ng-template>
