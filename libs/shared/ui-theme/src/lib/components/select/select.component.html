<div
	class="fpa-select-group fpa-mt-1"
	[class.fpa-select-group-dynamic]="isDynamic()"
	[class.fpa-select-group-open]="open()"
	[class.fpa-select-group-disabled]="formDisabled()"
	[class.fpa-dark-text]="darkText()"
	cdkOverlayOrigin
	#origin="cdkOverlayOrigin"
>
	@if (label()) {
		<label themeFloatingLabel [floating]="isFloating()" class="fpa-select-label" [for]="id()">
			{{ label() }}
		</label>
	}

	<button
		type="button"
		class="fpa-select"
		[class.fpa-dark-text]="darkText()"
		[id]="id()"
		[disabled]="formDisabled()"
		[attr.aria-expanded]="open()"
		aria-haspopup="listbox"
		(click)="toggle()"
		(focus)="onFocus()"
		(blur)="onBlur()"
	>
		<span class="fpa-select-value">
			{{ displayValue() }}
		</span>

		<span class="fpa-select-icon" [class.fpa-select-icon-open]="open()">
			<fast-svg [class.fpa-color-main-band]="open()" [name]="IconDefinition.CARET_DOWN" [size]="'16'"></fast-svg>
		</span>
	</button>
</div>

<ng-template
	cdkConnectedOverlay
	[cdkConnectedOverlayOrigin]="origin"
	[cdkConnectedOverlayOpen]="open()"
	[cdkConnectedOverlayPositions]="positions"
	[cdkConnectedOverlayHasBackdrop]="true"
	[cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
	[cdkConnectedOverlayPush]="true"
	[cdkConnectedOverlayFlexibleDimensions]="true"
	[cdkConnectedOverlayGrowAfterOpen]="true"
	[cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
	(backdropClick)="close()"
	(detach)="close()"
	(overlayKeydown)="$event.key === 'Escape' && close()"
>
	<div class="fpa-select-panel" [class.fpa-dark-text]="darkText()" role="listbox" [attr.aria-multiselectable]="multiple() ? true : null">
		@if (emptySelection() && !multiple()) {
			<button type="button" class="fpa-select-option fpa-select-option-empty" (click)="clearSelection()">&nbsp;</button>
		}

		@for (opt of options(); track opt.value) {
			<button
				type="button"
				class="fpa-select-option"
				[class.fpa-select-option-selected]="isSelected(opt.value)"
				[attr.aria-selected]="isSelected(opt.value)"
				(click)="selectOption(opt.value)"
			>
				@if (multiple()) {
					<span class="fpa-select-option-check" aria-hidden="true">
						@if (isSelected(opt.value)) {
							✓
						}
					</span>
				}

				<span>
					{{ opt.label }}
				</span>
			</button>
		}
	</div>
</ng-template>
