name: Main - Full CI + Sonar + Deploy homepage

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-nx-ci.yml
    with:
      mode: main
      base: ${{ github.event.before }}
      head: ${{ github.event.after }}
      run_sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PROJECT_KEY: ${{ secrets.PROJECT_KEY }}
      SONAR_ORG: ${{ secrets.SONAR_ORG }}

  deploy-homepage:
    needs: [ ci ]
    if: needs.ci.outputs.homepage_affected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci --ignore-scripts

      - name: Build homepage package (prod)
        run: npx nx run homepage:build-production

      - name: Create deploy marker tag (homepage@YYYY.MM.DD+N)
        run: |
          git fetch --tags

          DATE=$(TZ=Europe/Berlin date +%Y.%m.%d)
          PREFIX="homepage@${DATE}+"

          LAST_N=$(git tag --list "${PREFIX}*" \
            | sed -E "s/^${PREFIX}([0-9]+)$/\1/" \
            | sort -n \
            | tail -n 1)

          if [ -z "$LAST_N" ]; then
            NEXT_N=1
          else
            NEXT_N=$((LAST_N+1))
          fi

          TAG="${PREFIX}${NEXT_N}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Deploy marker: $TAG"

      - name: Upload to FTP server
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/production/
          server-dir: /html/
