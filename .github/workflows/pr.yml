name: PR - CI + Sonar + z21 default labels

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-nx-ci.yml
    with:
      mode: pr
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}
      run_sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PROJECT_KEY: ${{ secrets.PROJECT_KEY }}
      SONAR_ORG: ${{ secrets.SONAR_ORG }}

  default-release-labels:
    runs-on: ubuntu-latest
    needs: [ ci ]

    permissions:
      pull-requests: write

    steps:
      - name: Set default patch labels (if missing)
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const labels = context.payload.pull_request.labels.map(l => l.name);

            const uiLabels = [
              "release:z21-ui:patch",
              "release:z21-ui:minor",
              "release:z21-ui:major"
            ];

            const srvLabels = [
              "release:z21-server:patch",
              "release:z21-server:minor",
              "release:z21-server:major"
            ];

            const needUi =
              "${{ needs.ci.outputs.z21_ui_affected }}" === "true";

            const needSrv =
              "${{ needs.ci.outputs.z21_server_affected }}" === "true";

            const toAdd = [];

            if (needUi && !labels.some(l => uiLabels.includes(l))) {
              toAdd.push("release:z21-ui:patch");
            }

            if (needSrv && !labels.some(l => srvLabels.includes(l))) {
              toAdd.push("release:z21-server:patch");
            }

            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: toAdd
              });
            }
